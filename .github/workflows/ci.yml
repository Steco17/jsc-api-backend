name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-train.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run lint checks
        run: ruff check .
      - name: Run tests
        run: pytest
      - name: Build deployment image
        run: docker build --tag jsc-translator-backend:ci .
